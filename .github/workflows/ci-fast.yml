name: CI (Fast)

on:
  push:
  pull_request:

jobs:
  fast_ci:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Cache Nimble
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('**/*.nimble') }}

      - name: Compile (fast fail)
        run: nim c --mm:orc src/main.nim

      - name: Run tests
        run: |
          if exist tests\*.nim (
            nim c -r tests/test_all.nim
          ) else (
            echo "No tests found, skipping"
          )