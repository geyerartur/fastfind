name: CI (Slow / Extended)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extended:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Full build (release mode)
        run: nim c -d:release src/main.nim

      - name: Run tests
        shell: pwsh
        run: |
            if (Test-Path "tests\*.nim") {
            nim c -r tests\test_all.nim
            } else {
            Write-Host "No tests found, skipping"
            }

      - name: Static analysis
        run: nim check src/*.nim

      - name: Linting
        run: nim lint src/*.nim

      - name: Full release build
        run: nim c -d:release --mm:orc src/main.nim

      - name: Static analysis
        run: nim check src/*.nim

      - name: Rebuild tests in release mode
        run: nim c -d:release -r tests/test_all.nim