name: CI (Slow)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extended:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Compile (debug build)
        run: nim c src/main.nim

      - name: Compile (release build)
        run: nim c --warnings:on --hints:on src/main.nim -d:release --mm:orc src/main.nim

      - name: Static analysis (nim check)
        run: nim check src/main.nim

      - name: Run Nimble tests
        run: nimble test
    
      - name: Check formatting
        run: nimpretty --check src/

      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path "tests/test_all.nim") {
            nim c -r tests/test_all.nim
          } else {
            Write-Host "No test_all.nim found, skipping"
          }